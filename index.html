<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello PWA</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
<h1>Plank Timer!</h1>

<button id="start">Start plank</button>
<button id="stop" disabled>Stop plank</button>

<p>You are planking for: <span id="elapsed">0</span> seconds</p>

<p>Total plank time: <span id="total">0</span> seconds</p>
<p>Average time of last 10 planks: <span id="average">0</span> seconds</p>

<script>
    let startTime;
    let timer;

    const sessions = JSON.parse(localStorage.sessions || "[]");

    const elapsedDisplay = document.querySelector("#elapsed");
    const totalDisplay = document.querySelector("#total");
    const averageDisplay = document.querySelector("#average");

    function updateStatistics() {
        const total = sessions.reduce((sum, session) => sum + session.elapsed, 0);

        const lastTen = sessions.slice(-10);
        const average = lastTen.length
            ? lastTen.reduce((sum, session) => sum + session.elapsed, 0) / lastTen.length
            : 0;

        totalDisplay.textContent = total;
        averageDisplay.textContent = Math.round(average);
    }

    document.querySelector("#start").onclick = () => {
        startTime = new Date();

        document.querySelector("#start").disabled = true;
        document.querySelector("#stop").disabled = false;

        timer = setInterval(() => {
            const elapsed = Math.floor((new Date() - startTime) / 1000);
            elapsedDisplay.textContent = elapsed;
        }, 1000);
    };

    document.querySelector("#stop").onclick = () => {
        clearInterval(timer);

        const elapsed = Math.floor((new Date() - startTime) / 1000);

        sessions.push({
            start: startTime.toISOString(),
            elapsed: elapsed
        });

        localStorage.sessions = JSON.stringify(sessions);

        document.querySelector("#start").disabled = false;
        document.querySelector("#stop").disabled = true;

        updateStatistics();
    };

    updateStatistics();

    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
    }
</script>
</body>
</html>
